 if(RUN&&s.run_id&&s.run_id!==RUN&&(!s.mes||s.mes===MES_PAG)){const a=document.createElement('button');a.type='button';a.textContent='Atualizar';a.onclick=()=>location.reload();st.append(' · nova emissão disponível');st.appendChild(a);}}}catch(e){}})();
