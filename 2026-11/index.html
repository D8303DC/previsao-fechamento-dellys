const comPrazo=(url,ms)=>{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);return fetch(url,{cache:'no-store',signal:ac.signal}).finally(()=>clearTimeout(t));};
/* lista dos meses publicados (raiz do repositorio); falhou ou so ha um mes: sem seletor */

async function chave(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim()),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}

 const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();PM.then(sobrepor);}
