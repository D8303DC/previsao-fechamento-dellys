const MES_PAG='2026-11',RUN='20261104_142839_ee1164';
const $=id=>document.getElementById(id);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const comPrazo=(url,ms)=>{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);return fetch(url,{cache:'no-store',signal:ac.signal}).finally(()=>clearTimeout(t));};
/* lista dos meses publicados (raiz do repositorio); falhou ou so ha um mes: sem seletor */
const PM=comPrazo('../meses.json',3000).then(r=>r.ok?r.json():null).then(j=>j&&Array.isArray(j.meses)?j.meses.filter(m=>m&&/^\d{4}-\d{2}$/.test(m.mes)&&m.nome):null).catch(()=>null);
const alvo=m=>m.estado==='ativo'?'../app/':'../'+m.mes+'/';
const rotulo=m=>m.nome+' · '+(m.estado==='ativo'?'ativo':'fechado');
PM.then(ms=>{if(!ms||ms.length<2)return;const n=$('meses');if(!n)return;ms.forEach(m=>{const eu=m.mes===MES_PAG;const e=document.createElement(eu?'span':'a');e.className='mes'+(eu?' atual':'');if(eu)e.setAttribute('aria-current','page');else e.href=alvo(m);e.textContent=rotulo(m);n.appendChild(e);});n.hidden=false;});
/* depois de abrir o painel: botao "Meses" (se o painel ja tiver o seu bloco, marcado com data-pf-meses, nao faz nada) */
function sobrepor(ms){try{if(!ms||ms.length<2||!document.body||document.querySelector('[data-pf-meses]'))return;
 const css=document.createElement('style');css.textContent='.pf-m{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483000;font:600 12px/1.2 "Segoe UI",system-ui,sans-serif}.pf-m>button{all:unset;cursor:pointer;background:rgba(6,48,26,.88);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 13px;box-shadow:0 2px 10px rgba(0,0,0,.25)}.pf-m>div{position:absolute;right:0;bottom:calc(100% + 8px);background:#06301A;border-radius:12px;padding:6px;min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.35)}.pf-m a,.pf-m span{display:block;color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px}.pf-m span{background:#0F6B3A}@media print{.pf-m{display:none}}';
 const w=document.createElement('div');w.className='pf-m';w.setAttribute('data-pf-meses','1');const bt=document.createElement('button');bt.type='button';bt.textContent='Meses';bt.setAttribute('aria-expanded','false');const lista=document.createElement('div');lista.hidden=true;
 ms.forEach(m=>{const eu=m.mes===MES_PAG;const e=document.createElement(eu?'span':'a');if(eu)e.setAttribute('aria-current','page');else e.href=alvo(m);e.textContent=rotulo(m);lista.appendChild(e);});
 bt.onclick=()=>{lista.hidden=!lista.hidden;bt.setAttribute('aria-expanded',String(!lista.hidden));};w.appendChild(lista);w.appendChild(bt);document.head.appendChild(css);document.body.appendChild(w);}catch(e){}}
async function chave(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim()),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function abrirCom(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.nonce)},key,b64(P.ct));let bytes=new Uint8Array(pt);
 if(P.gz){const ds=new DecompressionStream('gzip');const st=new Blob([bytes]).stream().pipeThrough(ds);bytes=new Uint8Array(await new Response(st).arrayBuffer());}
 const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();PM.then(sobrepor);}
async function tentar(pw,lembrar){const m=$('m'),bt=$('b');bt.disabled=true;m.className='msg';m.innerHTML='<span class="spin"></span>Abrindo…';
 try{const key=await chave(pw);await abrirCom(key);
  if(lembrar){try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem('pf_k_'+P.salt,btoa(String.fromCharCode(...new Uint8Array(raw))));}catch(e){}}
 }catch(e){bt.disabled=false;m.textContent=(e&&e.name==='OperationError')?'Senha incorreta. Tente novamente.':'Não foi possível abrir: '+(e&&e.message||e);}}
$('f').addEventListener('submit',e=>{e.preventDefault();tentar($('s').value,$('lembrar').checked);});
(async()=>{try{const k=localStorage.getItem('pf_k_'+P.salt);if(k){$('m').innerHTML='<span class="spin"></span>Abrindo…';const key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},true,['decrypt']);await abrirCom(key);}}catch(e){$('m').textContent='';}})();
(async()=>{try{const r=await comPrazo('./status.json',3000);if(r.ok){const s=await r.json();const h=Math.round((Date.now()-new Date(s.emitido_em).getTime())/36e5);const st=$('st');if(!st)return;st.textContent=(s.status==='OK'?'Última emissão válida':'Última rodada com '+s.status)+' · '+(s.emitido_em||'').slice(0,16).replace('T',' ')+(h>26?' · atenção: mais de '+h+' h sem emissão nova':'');
