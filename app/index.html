const $=id=>document.getElementById(id);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function chave(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim()),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function abrirCom(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.nonce)},key,b64(P.ct));let bytes=new Uint8Array(pt);
 if(P.gz){const ds=new DecompressionStream('gzip');const st=new Blob([bytes]).stream().pipeThrough(ds);bytes=new Uint8Array(await new Response(st).arrayBuffer());}
 const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();}
async function tentar(pw,lembrar){const m=$('m'),bt=$('b');bt.disabled=true;m.className='msg';m.innerHTML='<span class="spin"></span>Abrindo…';
 try{const key=await chave(pw);await abrirCom(key);
  if(lembrar){try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem('pf_k_'+P.salt,btoa(String.fromCharCode(...new Uint8Array(raw))));}catch(e){}}
 }catch(e){bt.disabled=false;m.textContent=(e&&e.name==='OperationError')?'Senha incorreta. Tente novamente.':'Não foi possível abrir: '+(e&&e.message||e);}}
$('f').addEventListener('submit',e=>{e.preventDefault();tentar($('s').value,$('lembrar').checked);});
(async()=>{try{const k=localStorage.getItem('pf_k_'+P.salt);if(k){$('m').innerHTML='<span class="spin"></span>Abrindo…';const key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},true,['decrypt']);await abrirCom(key);}}catch(e){$('m').textContent='';}})();
(async()=>{try{const r=await fetch('./status.json',{cache:'no-store'});if(r.ok){const s=await r.json();const h=Math.round((Date.now()-new Date(s.emitido_em).getTime())/36e5);$('st').textContent=(s.status==='OK'?'Última emissão válida':'Última rodada com '+s.status)+' · '+(s.emitido_em||'').slice(0,16).replace('T',' ')+(h>26?' · atenção: mais de '+h+' h sem emissão nova':'');}}catch(e){}})();
